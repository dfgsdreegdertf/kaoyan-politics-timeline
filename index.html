<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="dark">
  <title>考研政治可视化时间轴</title>
  <meta name="description" content="用地图和时间轴复习考研政治，涵盖史纲、毛中特和马原的 58 个历史事件、重要会议与理论考点。支持拖动时间轴、倍速播放和地图定位。">
  <link rel="canonical" href="https://dfgsdreegdertf.github.io/kaoyan-politics-timeline/">
  <style>
    html { background: #0a0b12; color-scheme: dark; }
    body { max-width: 1440px; margin: 0 auto; padding: 12px; }
    @media (max-width: 530px) { body { padding: 0; } }
  </style>
</head>
<body>
<section id="exam-history-atlas" aria-label="考研政治可视化时间轴">
  <header class="atlas-header">
    <div class="atlas-heading">
      <div class="display-year"></div>
      <div class="heading-copy">
        <h2>考研政治 <span>·</span> 可视化时间轴</h2>
        <p class="heading-period"></p>
      </div>
      <button type="button" class="sidebar-toggle" aria-pressed="false">隐藏侧栏</button>
    </div>
    <div class="atlas-controls">
      <div class="transport" role="group" aria-label="播放控制">
        <button type="button" data-action="previous" aria-label="上一个事件">‹</button>
        <button type="button" data-action="play" aria-pressed="false">▶ 播放</button>
        <button type="button" data-action="next" aria-label="下一个事件">›</button>
        <select aria-label="播放速度" class="speed">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
        <button type="button" data-action="direction" aria-pressed="false">→ 正放</button>
      </div>
      <div class="atlas-settings" role="group" aria-label="地图和时间轴选项">
        <label><input type="checkbox" class="slow" checked> 节点减速</label>
        <label><input type="checkbox" class="basemap" checked> 地图背景</label>
        <label><input type="checkbox" class="distribution" checked> 阶段分布</label>
        <label><input type="checkbox" class="labels" checked> 地名</label>
        <label><input type="checkbox" class="hints" checked> 提示</label>
      </div>
      <div class="atlas-subjects" role="group" aria-label="切换科目">
        <button type="button" data-subject="history" aria-pressed="true">史纲</button>
        <button type="button" data-subject="theory" aria-pressed="false">毛中特</button>
        <button type="button" data-subject="marx" aria-pressed="false">马原</button>
        <button type="button" data-subject="all" aria-pressed="false">全部</button>
      </div>
    </div>
  </header>

  <div class="atlas-map" role="region" aria-label="事件地理地图">
    <div class="map-title" aria-hidden="true"><strong></strong><span></span></div>
    <div class="map-viewport">
      <div class="map-plane">
        <svg class="map-geometry" viewBox="0 0 600 475" preserveAspectRatio="none" aria-hidden="true">
          <path class="map-grid"></path><path class="map-land"></path><path class="map-borders"></path>
          <g class="map-regions"></g><path class="map-extra"></path><path class="map-guide"></path>
        </svg>
        <div class="map-labels" aria-hidden="true"></div>
        <div class="map-points"></div>
      </div>
    </div>
    <div class="map-zoom" role="group" aria-label="地图缩放">
      <button type="button" data-zoom="in" aria-label="放大地图">+</button>
      <button type="button" data-zoom="out" aria-label="缩小地图">−</button>
      <button type="button" data-zoom="reset">复位</button>
    </div>
    <small class="map-attribution"></small>
  </div>

  <div class="atlas-timeline" role="region" aria-label="交互时间轴">
    <div class="timeline-periods" aria-label="跳到历史阶段"></div>
    <div class="rail">
      <div class="rail-base"></div>
      <div class="rail-ticks" aria-hidden="true"></div>
      <div class="rail-needle" aria-hidden="true"></div>
      <div class="rail-current" aria-hidden="true"></div>
      <input class="rail-input" aria-label="拖动时间轴" type="range" step="any" min="1836" max="2023" value="1842">
      <div class="rail-events" role="group" aria-label="时间轴事件"></div>
    </div>
  </div>

  <article class="atlas-detail">
    <p class="detail-kicker"></p>
    <h3 class="detail-title"></h3>
    <p class="detail-meta"></p>
    <div class="detail-section">
      <h4>历史背景</h4>
      <p class="detail-fact"></p>
    </div>
    <div class="detail-section detail-highlight">
      <h4>关键考点</h4>
      <p class="detail-exam"></p>
    </div>
  </article>

  <aside class="atlas-sidebar" aria-label="事件定位与考点关联">
    <section class="sidebar-card">
      <h4>事件定位</h4>
      <p class="location-date"></p>
      <p class="location-name"></p>
      <p class="location-place"></p>
    </section>
    <section class="sidebar-card area-card">
      <h4 class="area-heading"></h4>
      <p class="area-title"></p>
      <ul class="area-legend"><li>当前事件</li><li class="legend-distribution">本阶段有事件的地区</li></ul>
      <p class="area-description"></p>
    </section>
    <section class="sidebar-card related-card">
      <h4>考点关联</h4>
      <div class="related-events"></div>
    </section>
  </aside>
  <p class="atlas-help">空格 播放或暂停 <span>·</span> ← → 切换事件 <span>·</span> 拖动时间轴切换年份 <span>·</span> 滚轮缩放地图或时间轴</p>
</section>
<style>
  #exam-history-atlas {
    color-scheme: dark;
    --bg: #0a0b12; --header: #0d0e16; --card: #12131d; --border: #292a38;
    --text: #eef0f7; --muted: #a5a7b7; --dim: #777b91; --gold: #e7cd76;
    --gold-dim: #8c7538; --blue: #86b8e8; --region: #453c24; --region-hot: #6d572c;
    box-sizing: border-box; display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 1.82fr) minmax(0, .98fr);
    grid-template-areas: "header header header" "detail map sidebar" "timeline timeline timeline" "help help help";
    gap: 0 12px; padding-inline: 15px;
    background: var(--bg); color: var(--text); font: 14px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
    border: 1px solid #222330; border-radius: 12px; overflow: hidden;
  }
  #exam-history-atlas *, #exam-history-atlas *::before, #exam-history-atlas *::after { box-sizing: border-box; }
  #exam-history-atlas [hidden] { display: none !important; }
  #exam-history-atlas p, #exam-history-atlas h2, #exam-history-atlas h3,
  #exam-history-atlas h4, #exam-history-atlas ul { margin: 0; }
  #exam-history-atlas button, #exam-history-atlas select {
    background: #151621; color: var(--muted); font: inherit; border: 1px solid var(--border); border-radius: 5px;
  }
  #exam-history-atlas button { cursor: pointer; }
  #exam-history-atlas button:hover { color: var(--text); border-color: #5c5e74; }
  #exam-history-atlas button:focus-visible, #exam-history-atlas input:focus-visible, #exam-history-atlas select:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  #exam-history-atlas .atlas-header {
    grid-area: header; margin-inline: -15px; padding: 12px 15px 10px; background: var(--header);
    border-bottom: 1px solid #20212b;
  }
  #exam-history-atlas .atlas-heading { display: flex; align-items: center; gap: 16px; }
  #exam-history-atlas .display-year {
    font: 400 clamp(43px, 5.8vw, 64px)/.98 Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums;
  }
  #exam-history-atlas .heading-copy { flex: 1; min-width: 0; }
  #exam-history-atlas h2 { font-size: 17px; letter-spacing: .09em; font-weight: 680; }
  #exam-history-atlas h2 span { color: var(--gold); }
  #exam-history-atlas .heading-period { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #exam-history-atlas .sidebar-toggle { align-self: start; padding: 6px 9px; font-size: 12px; }
  #exam-history-atlas .atlas-controls {
    display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 7px; margin-top: 11px;
  }
  #exam-history-atlas .transport, #exam-history-atlas .atlas-settings, #exam-history-atlas .atlas-subjects {
    display: flex; gap: 5px; align-items: center; font-size: 12px;
  }
  #exam-history-atlas .transport button, #exam-history-atlas .transport select {
    height: 32px; padding: 0 8px; white-space: nowrap;
  }
  #exam-history-atlas .transport button:first-child, #exam-history-atlas .transport button:nth-child(3) { min-width: 30px; font-size: 18px; }
  #exam-history-atlas .atlas-settings { flex-wrap: wrap; gap: 7px; color: var(--muted); }
  #exam-history-atlas .atlas-settings label { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  #exam-history-atlas .atlas-settings input { accent-color: #7899cd; margin: 0; }
  #exam-history-atlas .atlas-settings .slow { accent-color: #c3a74d; }
  #exam-history-atlas .atlas-subjects {
    border: 1px solid var(--border); border-radius: 6px; gap: 0; margin-left: auto; overflow: hidden;
  }
  #exam-history-atlas .atlas-subjects button { border: 0; border-radius: 0; background: transparent; min-height: 31px; padding: 0 11px; }
  #exam-history-atlas .atlas-subjects button + button { border-left: 1px solid var(--border); }
  #exam-history-atlas .atlas-subjects button[aria-pressed="true"] { color: var(--gold); background: #2b2418; font-weight: 650; }

  #exam-history-atlas .atlas-detail, #exam-history-atlas .atlas-map, #exam-history-atlas .atlas-sidebar { margin-block: 14px; min-width: 0; }
  #exam-history-atlas .atlas-detail {
    grid-area: detail; align-self: stretch; min-height: 359px; position: relative; padding: 20px 16px;
    background: var(--card); border: 1px solid #383122; border-left: 2px solid var(--gold-dim); border-radius: 7px;
  }
  #exam-history-atlas .atlas-detail::before {
    content: ""; position: absolute; right: 0; top: 0; width: 24px; height: 24px;
    background: linear-gradient(45deg, transparent 49%, #2d2618 50%); border-radius: 0 7px 0 0;
  }
  #exam-history-atlas .detail-kicker { color: var(--gold); font-size: 12px; letter-spacing: .12em; }
  #exam-history-atlas .detail-title { font-size: clamp(20px, 2.6vw, 31px); line-height: 1.25; margin-block: 10px 7px; overflow-wrap: anywhere; }
  #exam-history-atlas .detail-meta { color: var(--dim); font-size: 12px; }
  #exam-history-atlas .detail-section { margin-top: 17px; }
  #exam-history-atlas .detail-section h4 { color: var(--muted); font-size: 13px; letter-spacing: .045em; }
  #exam-history-atlas .detail-section p { margin-top: 7px; color: #c8cbd8; line-height: 1.8; overflow-wrap: anywhere; }
  #exam-history-atlas .detail-highlight { border-left: 1px solid var(--gold-dim); padding-left: 10px; }
  #exam-history-atlas .detail-highlight h4, #exam-history-atlas .detail-highlight p { color: var(--gold); }

  #exam-history-atlas .atlas-map {
    grid-area: map; align-self: stretch; min-height: 406px; position: relative; isolation: isolate; overflow: hidden;
    background: radial-gradient(ellipse at center, #151720, #0b0c14 73%);
  }
  #exam-history-atlas .map-title { position: absolute; top: 0; left: 1px; display: grid; z-index: 1; pointer-events: none; }
  #exam-history-atlas .map-title strong {
    color: #a9965940; font: 650 clamp(24px, 3.65vw, 42px)/1.1 "Microsoft YaHei", sans-serif; letter-spacing: .16em;
  }
  #exam-history-atlas .map-title span { margin-top: 6px; color: #9c906565; font-size: 11px; letter-spacing: .09em; }
  #exam-history-atlas .map-viewport {
    position: absolute; inset: 28px 0 14px; display: grid; place-items: center; cursor: grab; overflow: hidden;
    touch-action: pan-y;
  }
  #exam-history-atlas .map-viewport.is-panning { cursor: grabbing; }
  #exam-history-atlas .map-plane { position: relative; width: min(100%, 610px); aspect-ratio: 600 / 475; transform-origin: center; }
  #exam-history-atlas .map-geometry, #exam-history-atlas .map-labels, #exam-history-atlas .map-points {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  #exam-history-atlas .map-geometry, #exam-history-atlas .map-labels { pointer-events: none; }
  #exam-history-atlas .map-geometry path { vector-effect: non-scaling-stroke; }
  #exam-history-atlas .map-grid { fill: none; stroke: #262a3d; stroke-width: .55; opacity: .65; }
  #exam-history-atlas .map-land { fill: #151d2b; stroke: #364052; stroke-width: .55; }
  #exam-history-atlas .atlas-map[data-region="china"] .map-land { opacity: .42; }
  #exam-history-atlas .map-borders { fill: none; stroke: #485264; stroke-width: .8; }
  #exam-history-atlas .map-regions path { fill: var(--region); stroke: #96908965; stroke-width: .55; }
  #exam-history-atlas .map-regions path.is-hot { fill: var(--region-hot); }
  #exam-history-atlas .map-extra { fill: #a5a8b0; }
  #exam-history-atlas .map-guide { fill: none; stroke: #a6b8d4; stroke-width: 1; stroke-dasharray: 3 4; opacity: .48; }
  #exam-history-atlas .map-viewport.no-map .map-geometry, #exam-history-atlas .map-viewport.no-map .map-labels { visibility: hidden; }
  #exam-history-atlas .geo-label {
    position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
    white-space: nowrap; color: #e0dfd4; font-size: 11px; text-shadow: 0 1px 2px #000, 0 0 3px #000;
  }
  #exam-history-atlas .map-dot {
    position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
    display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; background: transparent;
  }
  #exam-history-atlas .map-dot i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px #d8af5347;
  }
  #exam-history-atlas .map-dot.is-current { z-index: 2; }
  #exam-history-atlas .map-dot.is-current i {
    width: 10px; height: 10px; background: #fff2ac; border: 2px solid #9b742a; box-shadow: 0 0 0 1px #f9de86, 0 0 12px #e9c75d;
  }
  #exam-history-atlas .map-dot span {
    position: absolute; left: calc(50% + 8px); width: max-content; max-width: 160px; padding: 2px 5px;
    border: 1px solid #6e654778; background: #10111a; color: var(--text); border-radius: 4px; font-size: 11px;
  }
  #exam-history-atlas .map-dot.left span { left: auto; right: calc(50% + 8px); }
  #exam-history-atlas .map-zoom { position: absolute; right: 5px; bottom: 25px; display: grid; gap: 4px; z-index: 3; }
  #exam-history-atlas .map-zoom button { min-width: 31px; min-height: 30px; }
  #exam-history-atlas .map-zoom button:last-child { font-size: 11px; }
  #exam-history-atlas .map-attribution {
    position: absolute; right: 2px; bottom: 3px; color: var(--dim); font-size: 11px;
    padding-inline: 4px; background: #0b0c14d9; pointer-events: none;
  }

  #exam-history-atlas .atlas-sidebar { grid-area: sidebar; align-self: end; display: grid; gap: 8px; }
  #exam-history-atlas .sidebar-card {
    min-width: 0; padding: 12px; background: var(--card); border: 1px solid var(--border); border-left: 2px solid #557ca7;
    border-radius: 7px; overflow-wrap: anywhere;
  }
  #exam-history-atlas .sidebar-card h4 { color: var(--blue); font-size: 12px; font-weight: 500; letter-spacing: .075em; }
  #exam-history-atlas .sidebar-card p { margin-top: 5px; }
  #exam-history-atlas .location-date, #exam-history-atlas .location-place { color: var(--muted); font-size: 12px; }
  #exam-history-atlas .location-name, #exam-history-atlas .area-title { font-size: 15px; font-weight: 650; }
  #exam-history-atlas .area-card { border-left-color: var(--gold-dim); }
  #exam-history-atlas .area-card h4 { color: var(--gold); }
  #exam-history-atlas .area-legend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; }
  #exam-history-atlas .area-legend li { color: var(--muted); font-size: 11px; }
  #exam-history-atlas .area-legend li::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 2px; background: var(--gold);
  }
  #exam-history-atlas .area-legend .legend-distribution::before { background: var(--region-hot); border: 1px solid #a4a4b578; }
  #exam-history-atlas .area-description { color: var(--dim); font-size: 11px; }
  #exam-history-atlas .related-events { display: grid; gap: 5px; margin-top: 6px; }
  #exam-history-atlas .related-events button {
    background: transparent; padding: 4px 0; border: 0; text-align: left; color: #ced1e0; font-size: 12px;
  }
  #exam-history-atlas .related-events button span { display: block; font-size: 11px; color: var(--dim); }

  #exam-history-atlas .atlas-timeline {
    grid-area: timeline; margin-inline: -15px; padding: 8px 23px 0; border-top: 1px solid #232430;
  }
  #exam-history-atlas .timeline-periods { position: relative; height: 25px; margin: 0 2px; }
  #exam-history-atlas .timeline-periods button {

  #exam-history-atlas .rail-base {

  }
  #exam-history-atlas .rail-input {
    appearance: none; position: absolute; left: -1px; width: calc(100% + 2px); top: 17px; height: 53px;

  }
  #exam-history-atlas .rail-input::-webkit-slider-runnable-track { background: transparent; }

  #exam-history-atlas .rail-input::-moz-range-thumb { width: 2px; height: 49px; border: 0; background: transparent; }
  #exam-history-atlas .rail-events { z-index: 2; }
  #exam-history-atlas .rail-event {
    position: absolute; left: var(--x); top: 44px; transform: translate(-50%, -50%);
    display: grid; place-items: center; width: 14px; height: 19px; padding: 0; border: 0; background: transparent;
    pointer-events: auto; touch-action: pan-y;
  }
  #exam-history-atlas .rail-event i { width: 6px; height: 6px; border-radius: 50%; background: #aa8a39; }
  #exam-history-atlas .rail-event[aria-pressed="true"] i { width: 10px; height: 10px; background: #fff1ab; box-shadow: 0 0 0 2px #aa8a39; }
  #exam-history-atlas .rail-caption {
    position: absolute; pointer-events: none; left: var(--x); top: 71px; transform: translateX(-50%);
    color: var(--dim); font-size: 11px; white-space: nowrap;
  }
  #exam-history-atlas .rail-caption.is-above { top: 5px; }
  #exam-history-atlas .atlas-help {
    grid-area: help; margin-inline: -15px; padding: 5px 12px 7px; border-top: 1px solid #20212b;
    text-align: center; color: var(--dim); font-size: 11px; overflow-wrap: anywhere;
  }
  #exam-history-atlas .atlas-help span { margin-inline: 4px; }
  #exam-history-atlas.hide-sidebars { grid-template-columns: 1fr; grid-template-areas: "header" "map" "timeline" "help"; }
  #exam-history-atlas.hide-sidebars .atlas-detail, #exam-history-atlas.hide-sidebars .atlas-sidebar { display: none; }

    }
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch {
      // Some browsers disable storage for local files.
    }
  }

      const right = Math.min(100, percent(end));

      button.textContent = label;
      button.style.setProperty("--left", `${left}%`);
      button.style.setProperty("--span", `${right - left}%`);

    }));

    const isMarx = event.region === "europe";
    const context = subject === "theory" ? "毛中特 · 马克思主义中国化时代化" :
      `${section} · ${phase}（${years}）`;
    $(".heading-period").textContent = context;
    root.style.setProperty("--region", fill);
    root.style.setProperty("--region-hot", accent);
    $(".map-title strong").textContent = mapTitle;
    $(".map-title span").textContent = `${event.year}年 · 事件定位`;
    $(".detail-kicker").textContent = subject === "theory" || isMarx ? "— 理论考点" : "— 历史背景";
    $(".detail-title").textContent = event.name;
    $(".detail-meta").textContent = `${isMarx ? "马原" : subject === "theory" ? "毛中特" : "史纲"} · ${phase} · ${event.category}`;
    $(".detail-fact").textContent = event.fact;
    $(".detail-exam").textContent = event.exam;
    $(".location-date").textContent = fullDate(event);
    $(".location-name").textContent = event.name;
    $(".location-place").textContent = event.place;
    $(".area-heading").textContent = isMarx ? "思想坐标" : "地图 · 阶段分布";
    $(".area-title").textContent = isMarx ? event.place : phase;
    $(".area-description").textContent = isMarx ? "欧洲地理底图 · 标注事件发生地。" :
      "底图采用现行区划。着色表示本阶段选录事件分布。";
    const linked = connections.filter(([from, to]) => from === event.id || to === event.id);
    const nodes = linked.map(([from, to, relation]) => {
      const target = byId.get(from === event.id ? to : from);
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `↗ ${target.shortName}`;
      const label = document.createElement("span");
      label.textContent = relation;
      button.append(label);
      button.addEventListener("click", () => jump(target));
      return button;
    });
    $(".related-events").replaceChildren(...nodes);
    $(".related-card").hidden = nodes.length === 0;
    drawMap(event.region);
    updateDistribution(event);
    drawPoints(event);
  }

  function eventAt(time) {
    return visibleEvents.findLast(event => event.time <= time + 0.00001) ?? visibleEvents[0];
  }

  function syncCursor(time, selected) {
    cursor = Math.min(domain[1], Math.max(domain[0], time));
    const event = selected ?? eventAt(cursor);
    if (event !== current) {
      current = event;
      drawEvent(event);
    }
    slider.value = cursor;
    slider.setAttribute("aria-valuetext", `${Math.floor(cursor)}年，当前事件 ${fullDate(event)} ${event.name}`);
    $(".display-year").textContent = Math.floor(cursor);
    rail.style.setProperty("--progress", `${Math.min(100, Math.max(0, percent(cursor)))}%`);
    const selectedLabel = $(".rail-current");
    const selectedPosition = percent(event.time);
    selectedLabel.hidden = selectedPosition < 0 || selectedPosition > 100;
    selectedLabel.textContent = event.shortName;
    rail.style.setProperty("--selected-label", `${selectedPosition}%`);
    for (const caption of marks.querySelectorAll(".rail-caption.is-above")) {
      caption.hidden = Math.abs(percent(Number(caption.dataset.time)) - selectedPosition) < 14;
    }
    for (const [id, dot] of markerButtons) dot.setAttribute("aria-pressed", String(id === event.id));
  }

  function setSubject(next, time, selected) {
    subject = next;
    visibleEvents = events.filter(event => next === "all" || event.topics.includes(next));
    domain = next === "marx" ? [1828, 1933] : [1836, 2023];
    range = [...domain];
    for (const button of subjectButtons) button.setAttribute("aria-pressed", String(button.dataset.subject === next));
    current = null;
    drawRuler();
    syncCursor(time, selected);
  }

  function jump(event) {
    stop();
    if (!visibleEvents.includes(event)) {
      setSubject(event.topics[0], event.time, event);
    } else {
      if (event.time < range[0] || event.time > range[1]) {
        range = [...domain];
        drawRuler();
      }
      syncCursor(event.time, event);
    }
    save();
  }

  function stepEvent(amount) {
    const index = visibleEvents.indexOf(current) + amount;
    const event = visibleEvents[Math.max(0, Math.min(index, visibleEvents.length - 1))];
    jump(event);
  }

  function tick(now) {
    const elapsed = Math.min(80, now - lastTick);
    lastTick = now;
    if (now >= holdUntil) {
      const edge = direction === 1 ? range[1] : range[0];
      const distance = elapsed / 1000 * Number($(".speed").value) * 9 * direction;
      const next = direction === 1 ? Math.min(edge, cursor + distance) : Math.max(edge, cursor + distance);
      const passed = direction === 1 ? visibleEvents.find(event => event.time > cursor && event.time <= next)
        : visibleEvents.findLast(event => event.time < cursor && event.time >= next);
      if (passed && $(".slow").checked) {
        syncCursor(passed.time, passed);
        holdUntil = now + 270 / Number($(".speed").value);
      } else {
        syncCursor(next);
      }
      if (cursor === edge) {
        stop();
        save();
        return;
      }
    }
    animationId = requestAnimationFrame(tick);
  }

  function togglePlayback() {
    if (animationId) {
      stop();
      save();
      return;
    }
    if (direction === 1 && cursor >= range[1]) syncCursor(range[0]);
    if (direction === -1 && cursor <= range[0]) syncCursor(range[1]);
    playButton.textContent = "Ⅱ 暂停";
    playButton.setAttribute("aria-pressed", "true");
    lastTick = performance.now();
    holdUntil = 0;
    animationId = requestAnimationFrame(tick);
  }

  function setZoom(factor) {
    zoom = Math.min(4, Math.max(1, zoom * factor));
    if (zoom === 1) resetView();
    else updateView();
  }

  for (const button of subjectButtons) {
    button.addEventListener("click", () => {
      const next = button.dataset.subject;
      if (next === subject) return;
      stop();
      const first = next === "marx" ? byId.get("leaguejustice") : byId.get("nanjing");
      const keep = next === "all" || current.topics.includes(next);
      setSubject(next, keep ? cursor : next === "theory" ? 1938.75 : first.time, keep ? current : null);
      save();
    });
  }
  $('[data-action="previous"]').addEventListener("click", () => stepEvent(-1));
  $('[data-action="next"]').addEventListener("click", () => stepEvent(1));
  playButton.addEventListener("click", togglePlayback);
  directionButton.addEventListener("click", () => {
    direction *= -1;
    holdUntil = 0;
    directionButton.textContent = direction === 1 ? "→ 正放" : "← 倒放";
    directionButton.setAttribute("aria-pressed", String(direction === -1));
  });
  $(".sidebar-toggle").addEventListener("click", event => {
    const hidden = root.classList.toggle("hide-sidebars");
    event.currentTarget.textContent = hidden ? "显示侧栏" : "隐藏侧栏";
    event.currentTarget.setAttribute("aria-pressed", String(hidden));
  });
  $(".basemap").addEventListener("change", event => viewport.classList.toggle("no-map", !event.target.checked));
  $(".distribution").addEventListener("change", () => updateDistribution(current));
  $(".labels").addEventListener("change", event => { labels.hidden = !event.target.checked; });
  $(".hints").addEventListener("change", event => { $(".atlas-help").hidden = !event.target.checked; });
  $('[data-zoom="in"]').addEventListener("click", () => setZoom(1.35));
  $('[data-zoom="out"]').addEventListener("click", () => setZoom(1 / 1.35));
  $('[data-zoom="reset"]').addEventListener("click", resetView);
  viewport.addEventListener("wheel", event => {
    event.preventDefault();
    setZoom(event.deltaY < 0 ? 1.18 : 1 / 1.18);
  }, { passive: false });
  viewport.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest("button")) return;
    pan = { id: event.pointerId, startX: event.clientX - panX, startY: event.clientY - panY };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add("is-panning");
  });
  viewport.addEventListener("pointermove", event => {
    if (pan?.id !== event.pointerId) return;
    panX = Math.max(-viewport.clientWidth * zoom / 2, Math.min(viewport.clientWidth * zoom / 2, event.clientX - pan.startX));
    panY = Math.max(-viewport.clientHeight * zoom / 2, Math.min(viewport.clientHeight * zoom / 2, event.clientY - pan.startY));
    updateView();
  });
  viewport.addEventListener("lostpointercapture", () => {
    pan = null;
    viewport.classList.remove("is-panning");
  });
  slider.addEventListener("input", () => {
    stop();
    syncCursor(slider.valueAsNumber);
  });
  slider.addEventListener("change", save);
  marks.addEventListener("pointerdown", event => {
    const dot = event.target.closest(".rail-event");
    if (!dot || event.button !== 0) return;
    skipMarkerClick = null;
    railDrag = { pointerId: event.pointerId, dot, x: event.clientX, moved: false };
    dot.setPointerCapture(event.pointerId);
  });
  marks.addEventListener("pointermove", event => {
    if (railDrag?.pointerId !== event.pointerId) return;
    if (!railDrag.moved && Math.abs(event.clientX - railDrag.x) < 4) return;
    railDrag.moved = true;
    stop();
    const box = rail.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
    syncCursor(range[0] + fraction * (range[1] - range[0]));
  });
  marks.addEventListener("lostpointercapture", () => {
    if (railDrag?.moved) {
      skipMarkerClick = railDrag.dot;
      save();
    }
    railDrag = null;
  });
  timeline.addEventListener("wheel", event => {
    if (!event.target.closest(".rail")) return;
    event.preventDefault();
    stop();
    const full = domain[1] - domain[0];
    const width = Math.min(full, Math.max(8, (range[1] - range[0]) * (event.deltaY < 0 ? 0.75 : 1 / 0.75)));
    const center = Math.min(range[1], Math.max(range[0], cursor));
    const start = Math.min(domain[1] - width, Math.max(domain[0], center - width / 2));
    range = [start, start + width];
    drawRuler();
    syncCursor(cursor, current);
  }, { passive: false });
  root.addEventListener("keydown", event => {
    if (event.target.matches("input:not(.rail-input),select,textarea")) return;
    if ((event.code === "Space" && !event.target.matches("button")) || event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      if (event.code === "Space") togglePlayback();
      else stepEvent(event.key === "ArrowRight" ? 1 : -1);
    }
  });

  function restore(widgetState) {
    const saved = widgetState?.privateContent;
    const selected = byId.get(saved?.id) ?? byId.get("nanjing");
    const preferred = saved?.subject;
    const next = Object.hasOwn(subjectLabels, preferred) && (preferred === "all" || selected.topics.includes(preferred))
      ? preferred : selected.topics[0];
    const time = Number.isFinite(saved?.cursor) ? saved.cursor : selected.time;
    if (current === selected && subject === next && time === cursor) return;
    stop();
    setSubject(next, time, selected);
  }
  restore(readSavedSelection());
  window.addEventListener("openai:set_globals", event => {
    if (event.detail?.globals && Object.hasOwn(event.detail.globals, "widgetState")) restore(event.detail.globals.widgetState);
  });
})();
</script>

</body>
</html>
