<section id="exam-history-atlas" aria-label="考研政治可视化时间轴">
  <header class="atlas-header">
    <div class="atlas-heading">
      <div class="display-year"></div>
      <div class="heading-copy">
        <h2>考研政治 <span>·</span> 可视化时间轴</h2>
        <p class="heading-period"></p>
      </div>
      <button type="button" class="sidebar-toggle" aria-pressed="false">隐藏侧栏</button>
    </div>
    <div class="atlas-controls">
      <div class="transport" role="group" aria-label="播放控制">
        <button type="button" data-action="previous" aria-label="上一个事件">‹</button>
        <button type="button" data-action="play" aria-pressed="false">▶ 播放</button>
        <button type="button" data-action="next" aria-label="下一个事件">›</button>
        <select aria-label="播放速度" class="speed">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
        <button type="button" data-action="direction" aria-pressed="false">→ 正放</button>
      </div>
      <div class="atlas-settings" role="group" aria-label="地图和时间轴选项">
        <label><input type="checkbox" class="slow" checked> 节点减速</label>
        <label><input type="checkbox" class="basemap" checked> 地图背景</label>
        <label><input type="checkbox" class="distribution" checked> 阶段分布</label>
        <label><input type="checkbox" class="labels" checked> 地名</label>
        <label><input type="checkbox" class="hints" checked> 提示</label>
      </div>
      <div class="atlas-subjects" role="group" aria-label="切换科目">
        <button type="button" data-subject="history" aria-pressed="true">史纲</button>
        <button type="button" data-subject="theory" aria-pressed="false">毛中特</button>
        <button type="button" data-subject="marx" aria-pressed="false">马原</button>
        <button type="button" data-subject="all" aria-pressed="false">全部</button>
      </div>
    </div>
  </header>

  <div class="atlas-map" role="region" aria-label="事件地理地图">
    <div class="map-title" aria-hidden="true"><strong></strong><span></span></div>
    <div class="map-viewport">
      <div class="map-plane">
        <svg class="map-geometry" viewBox="0 0 600 475" preserveAspectRatio="none" aria-hidden="true">
          <path class="map-grid"></path><path class="map-land"></path><path class="map-borders"></path>
          <g class="map-regions"></g><path class="map-extra"></path><path class="map-guide"></path>
        </svg>
        <div class="map-labels" aria-hidden="true"></div>
        <div class="map-points"></div>
      </div>
    </div>
    <div class="map-zoom" role="group" aria-label="地图缩放">
      <button type="button" data-zoom="in" aria-label="放大地图">+</button>
      <button type="button" data-zoom="out" aria-label="缩小地图">−</button>
      <button type="button" data-zoom="reset">复位</button>
    </div>
    <small class="map-attribution"></small>
  </div>

  <div class="atlas-timeline" role="region" aria-label="交互时间轴">
    <div class="timeline-periods" aria-label="跳到历史阶段"></div>
    <div class="rail">
      <div class="rail-base"></div>
      <div class="rail-ticks" aria-hidden="true"></div>
      <div class="rail-needle" aria-hidden="true"></div>
      <div class="rail-current" aria-hidden="true"></div>
      <input class="rail-input" aria-label="拖动时间轴" type="range" step="any" min="1836" max="2023" value="1842">
      <div class="rail-events" role="group" aria-label="时间轴事件"></div>
    </div>
  </div>

  <article class="atlas-detail">
    <p class="detail-kicker"></p>
    <h3 class="detail-title"></h3>
    <p class="detail-meta"></p>
    <div class="detail-section">
      <h4>历史背景</h4>
      <p class="detail-fact"></p>
    </div>
    <div class="detail-section detail-highlight">
      <h4>关键考点</h4>
      <p class="detail-exam"></p>
    </div>
  </article>

  <aside class="atlas-sidebar" aria-label="事件定位与考点关联">
    <section class="sidebar-card">
      <h4>事件定位</h4>
      <p class="location-date"></p>
      <p class="location-name"></p>
      <p class="location-place"></p>
    </section>
    <section class="sidebar-card area-card">
      <h4 class="area-heading"></h4>
      <p class="area-title"></p>
      <ul class="area-legend"><li>当前事件</li><li class="legend-distribution">本阶段有事件的地区</li></ul>
      <p class="area-description"></p>
    </section>
    <section class="sidebar-card related-card">
      <h4>考点关联</h4>
      <div class="related-events"></div>
    </section>
  </aside>
  <p class="atlas-help">空格 播放或暂停 <span>·</span> ← → 切换事件 <span>·</span> 拖动时间轴切换年份 <span>·</span> 滚轮缩放地图或时间轴</p>
</section>

    #exam-history-atlas .atlas-controls { gap: 9px; }

    #exam-history-atlas .atlas-subjects button { flex: 1; min-height: 36px; }
    #exam-history-atlas .transport button, #exam-history-atlas .transport select { height: 36px; }
    #exam-history-atlas .atlas-settings { font-size: 11px; }
    #exam-history-atlas .atlas-map, #exam-history-atlas.hide-sidebars .atlas-map { min-height: 278px; margin-block: 7px; }
    #exam-history-atlas .geo-label.secondary { display: none; }
    #exam-history-atlas .atlas-timeline { padding-inline: 13px; }
    #exam-history-atlas .rail-caption { display: none; }
    #exam-history-atlas .rail-current { max-width: 58%; }
    #exam-history-atlas .rail { height: 79px; }
    #exam-history-atlas .rail-tick:nth-child(even) { display: none; }
    #exam-history-atlas .atlas-detail { min-height: 0; margin-block: 6px; }
    #exam-history-atlas .atlas-sidebar { grid-template-columns: 1fr; margin-block: 5px 10px; }
    #exam-history-atlas .map-dot span { max-width: 120px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById("exam-history-atlas");
  const { events, connections, maps } = __ATLAS_DATA__;
  const $ = selector => root.querySelector(selector);
  const svgNS = "http://www.w3.org/2000/svg";
  const timeline = $(".atlas-timeline");
  const rail = $(".rail");
  const slider = $(".rail-input");
  const marks = $(".rail-events");
  const labels = $(".map-labels");
  const viewport = $(".map-viewport");
  const mapPlane = $(".map-plane");
  const mapPoints = $(".map-points");
  const playButton = $('[data-action="play"]');
  const directionButton = $('[data-action="direction"]');
  const themeOptions = {
    late: ["上编", "旧民主主义革命时期", "1840—1919", "大清", "#453720", "#69502e"],
    republic: ["上编", "旧民主主义革命时期", "1840—1919", "中华民国", "#353d50", "#55536c"],
    revolution: ["中编", "新民主主义革命时期", "1919—1949", "中华民国", "#303c54", "#515080"],
    antiwar: ["中编", "新民主主义革命时期", "1919—1949", "中华民国", "#32465e", "#754e50"],
    building: ["下编", "社会主义革命和建设", "1949—1978", "中华人民共和国", "#4d303c", "#733c50"],
    reform: ["下编", "改革开放和现代化建设", "1978—2012", "中华人民共和国", "#283d64", "#426294"],
    newera: ["下编", "中国特色社会主义新时代", "2012—", "中华人民共和国", "#524420", "#77612d"],
    marx: ["马原", "马克思主义发展史", "1836—1919", "马克思主义", "#202a3a", "#435878"]
  };
  const subjectLabels = { history: "史纲", theory: "毛中特", marx: "马原", all: "全部" };
  const anchors = new Set(["opium", "tianjing", "boxerprotocol", "mayfourth", "cpc7", "cpc8", "eleventh3", "cpc18",
    "leaguejustice", "manifesto", "international1", "engels", "october"]);
  const subjectButtons = [...root.querySelectorAll("[data-subject]")];
  const byId = new Map(events.map(event => [event.id, event]));
  const storageKey = "kaoyan-politics-timeline.selection.v1";
  let subject, visibleEvents, domain, range, cursor, current;
  let currentMap, regions = new Map();
  let markerButtons = new Map();
  let direction = 1;
  let animationId = 0;
  let lastTick = 0;
  let holdUntil = 0;
  let zoom = 1, panX = 0, panY = 0, pan;
  let railDrag, skipMarkerClick;

  function theme(event) {
    if (event.region === "europe") return "marx";
    const year = Number(event.year);
    if (year < 1912) return "late";
    if (year < 1919) return "republic";
    if (year < 1937) return "revolution";
    if (year < 1949 || (year === 1949 && event.start < "1949-10-01")) return "antiwar";
    if (year < 1978) return "building";
    if (year < 2012) return "reform";
    return "newera";
  }

  function fullDate(event) {
    return `${event.year}年${event.date}`;
  }

  function save() {
    if (!current) return;
    const state = {
      modelContent: { year: current.year, event: current.name, subject: subjectLabels[subject] },
      privateContent: { id: current.id, year: current.year, subject, cursor }
    };
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState(state).catch(() => {});
      return;
    }
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch {
      // Some browsers disable storage for local files.
    }
  }

  function readSavedSelection() {
    if (window.openai?.widgetState) return window.openai.widgetState;
    try {
      return JSON.parse(localStorage.getItem(storageKey));
    } catch {
      return null;
    }
  }

  function stop() {
    if (!animationId) return;
    cancelAnimationFrame(animationId);
    animationId = 0;
    playButton.textContent = "▶ 播放";
    playButton.setAttribute("aria-pressed", "false");
  }

  function percent(value) {
    return (value - range[0]) / (range[1] - range[0]) * 100;
  }

  function position(element, x, y) {
    element.style.setProperty("--x", `${x}%`);
    element.style.setProperty("--y", `${y}%`);
  }

  function drawRuler() {
    slider.min = range[0];
    slider.max = range[1];
    const periods = subject === "marx"
      ? [[1836, 1848, "创立"], [1848, 1895, "发展"], [1895, 1924, "列宁阶段"]]
      : [[1840, 1919, "上编"], [1919, 1949, "中编"], [1949, 2023, "下编"]];
    $(".timeline-periods").replaceChildren(...periods.filter(([start, end]) => end > range[0] && start < range[1]).map(([start, end, label]) => {
      const button = document.createElement("button");
      const left = Math.max(0, percent(start));
      const right = Math.min(100, percent(end));
      button.type = "button";
      button.textContent = label;
      button.style.setProperty("--left", `${left}%`);
      button.style.setProperty("--span", `${right - left}%`);
      button.addEventListener("click", () => {
        const first = visibleEvents.find(event => event.time >= start && event.time < end);
        if (first) jump(first);
      });
      return button;
    }));
    const span = range[1] - range[0];
    const step = [1, 2, 5, 10, 20, 25, 50].find(value => span / value <= 11) ?? 50;
    const ticks = [];
    for (let year = Math.ceil(range[0] / step) * step; year <= range[1]; year += step) {
      const tick = document.createElement("span");
      tick.className = "rail-tick";
      tick.style.setProperty("--x", `${percent(year)}%`);
      tick.textContent = year;
      ticks.push(tick);
    }
    $(".rail-ticks").replaceChildren(...ticks);
    markerButtons = new Map();
    const nodes = [];
    let lastCaption = -20;
    let captionCount = 0;
    for (const event of visibleEvents) {
      if (event.time < range[0] || event.time > range[1]) continue;
      const x = percent(event.time);
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "rail-event";
      dot.style.setProperty("--x", `${x}%`);
      dot.setAttribute("aria-label", `${fullDate(event)}，${event.name}`);
      dot.title = `${fullDate(event)} · ${event.name}`;
      dot.setAttribute("aria-pressed", "false");
      dot.append(document.createElement("i"));
      dot.addEventListener("click", click => {
        if (click.detail && skipMarkerClick === dot) {
          skipMarkerClick = null;
          return;
        }
        jump(event);
      });
      markerButtons.set(event.id, dot);
      nodes.push(dot);
      if (anchors.has(event.id) && x > 6 && x < 94 && x - lastCaption > 13) {
        const caption = document.createElement("span");
        caption.className = `rail-caption${captionCount++ % 2 ? " is-above" : ""}`;
        caption.style.setProperty("--x", `${x}%`);
        caption.dataset.time = event.time;
        caption.textContent = event.shortName;
        caption.setAttribute("aria-hidden", "true");
        lastCaption = x;
        nodes.push(caption);
      }
    }
    marks.replaceChildren(...nodes);
  }

  function updateView() {
    mapPlane.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    updateView();
  }

  function drawMap(region) {
    if (currentMap === region) return;
    currentMap = region;
    $(".atlas-map").dataset.region = region;
    const map = maps[region];
    $(".map-grid").setAttribute("d", map.grid ?? "");
    $(".map-land").setAttribute("d", map.land ?? "");
    $(".map-borders").setAttribute("d", map.borders ?? "");
    $(".map-extra").setAttribute("d", map.extra ?? "");
    regions = new Map((map.regions ?? []).map(area => {
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", area.path ?? "");
      return [area.name, path];
    }));
    $(".map-regions").replaceChildren(...regions.values());
    labels.replaceChildren(...map.labels.map(label => {
      const node = document.createElement("span");
      node.className = label.primary ? "geo-label" : "geo-label secondary";
      position(node, ...label.point);
      node.textContent = label.name;
      return node;
    }));
    $(".map-attribution").textContent = region === "china" ? "DataV · 现行区划示意" : "Natural Earth · 欧洲地理底图";
    resetView();
  }

  function updateDistribution(event) {
    const shown = $(".distribution").checked && event.region === "china";
    const highlighted = new Set(shown ? visibleEvents.filter(item => theme(item) === theme(event)).map(item => item.province) : []);
    for (const [name, shape] of regions) shape.classList.toggle("is-hot", highlighted.has(name));
    $(".legend-distribution").hidden = !shown;
  }

  function drawPoints(event) {
    const x = event.x * 6;
    const y = event.y * 4.75;
    $(".map-guide").setAttribute("d", `M${x},${y} Q${(x + 590) / 2},${y - 22} 590,126`);
    const others = visibleEvents.filter(item =>
      item !== event && item.region === event.region && item.year === event.year &&
      Math.hypot(item.x - event.x, item.y - event.y) > 3.2
    );
    mapPoints.replaceChildren(...[...others, event].map(item => {
      const active = item === event;
      const button = document.createElement("button");
      button.type = "button";
      button.className = `map-dot${active ? " is-current" : ""}${item.x > 51 ? " left" : ""}`;
      position(button, item.x, item.y);
      button.setAttribute("aria-label", `${item.name}，${item.place}`);
      button.append(document.createElement("i"));
      if (active) {
        const name = document.createElement("span");
        name.textContent = item.shortName;
        button.append(name);
      }
      button.addEventListener("click", () => jump(item));
      return button;
    }));
  }

  function drawEvent(event) {
    const [section, phase, years, mapTitle, fill, accent] = themeOptions[theme(event)];
    const isMarx = event.region === "europe";
    const context = subject === "theory" ? "毛中特 · 马克思主义中国化时代化" :
      `${section} · ${phase}（${years}）`;
    $(".heading-period").textContent = context;
    root.style.setProperty("--region", fill);
    root.style.setProperty("--region-hot", accent);
    $(".map-title strong").textContent = mapTitle;
    $(".map-title span").textContent = `${event.year}年 · 事件定位`;
    $(".detail-kicker").textContent = subject === "theory" || isMarx ? "— 理论考点" : "— 历史背景";
    $(".detail-title").textContent = event.name;
    $(".detail-meta").textContent = `${isMarx ? "马原" : subject === "theory" ? "毛中特" : "史纲"} · ${phase} · ${event.category}`;
    $(".detail-fact").textContent = event.fact;
    $(".detail-exam").textContent = event.exam;
    $(".location-date").textContent = fullDate(event);
    $(".location-name").textContent = event.name;
    $(".location-place").textContent = event.place;
    $(".area-heading").textContent = isMarx ? "思想坐标" : "地图 · 阶段分布";
    $(".area-title").textContent = isMarx ? event.place : phase;
    $(".area-description").textContent = isMarx ? "欧洲地理底图 · 标注事件发生地。" :
      "底图采用现行区划。着色表示本阶段选录事件分布。";
    const linked = connections.filter(([from, to]) => from === event.id || to === event.id);
    const nodes = linked.map(([from, to, relation]) => {
      const target = byId.get(from === event.id ? to : from);
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `↗ ${target.shortName}`;
      const label = document.createElement("span");
      label.textContent = relation;
      button.append(label);
      button.addEventListener("click", () => jump(target));
      return button;
    });
    $(".related-events").replaceChildren(...nodes);
    $(".related-card").hidden = nodes.length === 0;
    drawMap(event.region);
    updateDistribution(event);
    drawPoints(event);
  }

  function eventAt(time) {
    return visibleEvents.findLast(event => event.time <= time + 0.00001) ?? visibleEvents[0];
  }

  function syncCursor(time, selected) {
    cursor = Math.min(domain[1], Math.max(domain[0], time));
    const event = selected ?? eventAt(cursor);
    if (event !== current) {
      current = event;
      drawEvent(event);
    }
    slider.value = cursor;
    slider.setAttribute("aria-valuetext", `${Math.floor(cursor)}年，当前事件 ${fullDate(event)} ${event.name}`);
    $(".display-year").textContent = Math.floor(cursor);
    rail.style.setProperty("--progress", `${Math.min(100, Math.max(0, percent(cursor)))}%`);
    const selectedLabel = $(".rail-current");
    const selectedPosition = percent(event.time);
    selectedLabel.hidden = selectedPosition < 0 || selectedPosition > 100;
    selectedLabel.textContent = event.shortName;
    rail.style.setProperty("--selected-label", `${selectedPosition}%`);
    for (const caption of marks.querySelectorAll(".rail-caption.is-above")) {
      caption.hidden = Math.abs(percent(Number(caption.dataset.time)) - selectedPosition) < 14;
    }
    for (const [id, dot] of markerButtons) dot.setAttribute("aria-pressed", String(id === event.id));
  }

  function setSubject(next, time, selected) {
    subject = next;
    visibleEvents = events.filter(event => next === "all" || event.topics.includes(next));
    domain = next === "marx" ? [1828, 1933] : [1836, 2023];
    range = [...domain];
    for (const button of subjectButtons) button.setAttribute("aria-pressed", String(button.dataset.subject === next));
    current = null;
    drawRuler();
    syncCursor(time, selected);
  }

  function jump(event) {
    stop();
    if (!visibleEvents.includes(event)) {
      setSubject(event.topics[0], event.time, event);
    } else {
      if (event.time < range[0] || event.time > range[1]) {
        range = [...domain];
        drawRuler();
      }
      syncCursor(event.time, event);
    }
    save();
  }

  function stepEvent(amount) {
    const index = visibleEvents.indexOf(current) + amount;
    const event = visibleEvents[Math.max(0, Math.min(index, visibleEvents.length - 1))];
    jump(event);
  }

  function tick(now) {
    const elapsed = Math.min(80, now - lastTick);
    lastTick = now;
    if (now >= holdUntil) {
      const edge = direction === 1 ? range[1] : range[0];
      const distance = elapsed / 1000 * Number($(".speed").value) * 9 * direction;
      const next = direction === 1 ? Math.min(edge, cursor + distance) : Math.max(edge, cursor + distance);
      const passed = direction === 1 ? visibleEvents.find(event => event.time > cursor && event.time <= next)
        : visibleEvents.findLast(event => event.time < cursor && event.time >= next);
      if (passed && $(".slow").checked) {
        syncCursor(passed.time, passed);
        holdUntil = now + 270 / Number($(".speed").value);
      } else {
        syncCursor(next);
      }
      if (cursor === edge) {
        stop();
        save();
        return;
      }
    }
    animationId = requestAnimationFrame(tick);
  }

  function togglePlayback() {
    if (animationId) {
      stop();
      save();
      return;
    }
    if (direction === 1 && cursor >= range[1]) syncCursor(range[0]);
    if (direction === -1 && cursor <= range[0]) syncCursor(range[1]);
    playButton.textContent = "Ⅱ 暂停";
    playButton.setAttribute("aria-pressed", "true");
    lastTick = performance.now();
    holdUntil = 0;
    animationId = requestAnimationFrame(tick);
  }

  function setZoom(factor) {
    zoom = Math.min(4, Math.max(1, zoom * factor));
    if (zoom === 1) resetView();
    else updateView();
  }

  for (const button of subjectButtons) {
    button.addEventListener("click", () => {
      const next = button.dataset.subject;
      if (next === subject) return;
      stop();
      const first = next === "marx" ? byId.get("leaguejustice") : byId.get("nanjing");
      const keep = next === "all" || current.topics.includes(next);
      setSubject(next, keep ? cursor : next === "theory" ? 1938.75 : first.time, keep ? current : null);
      save();
    });
  }
  $('[data-action="previous"]').addEventListener("click", () => stepEvent(-1));
  $('[data-action="next"]').addEventListener("click", () => stepEvent(1));
  playButton.addEventListener("click", togglePlayback);
  directionButton.addEventListener("click", () => {
    direction *= -1;
    holdUntil = 0;
    directionButton.textContent = direction === 1 ? "→ 正放" : "← 倒放";
    directionButton.setAttribute("aria-pressed", String(direction === -1));
  });
  $(".sidebar-toggle").addEventListener("click", event => {
    const hidden = root.classList.toggle("hide-sidebars");
    event.currentTarget.textContent = hidden ? "显示侧栏" : "隐藏侧栏";
    event.currentTarget.setAttribute("aria-pressed", String(hidden));
  });
  $(".basemap").addEventListener("change", event => viewport.classList.toggle("no-map", !event.target.checked));
  $(".distribution").addEventListener("change", () => updateDistribution(current));
  $(".labels").addEventListener("change", event => { labels.hidden = !event.target.checked; });
  $(".hints").addEventListener("change", event => { $(".atlas-help").hidden = !event.target.checked; });
  $('[data-zoom="in"]').addEventListener("click", () => setZoom(1.35));
  $('[data-zoom="out"]').addEventListener("click", () => setZoom(1 / 1.35));
  $('[data-zoom="reset"]').addEventListener("click", resetView);
  viewport.addEventListener("wheel", event => {
    event.preventDefault();
    setZoom(event.deltaY < 0 ? 1.18 : 1 / 1.18);
  }, { passive: false });
  viewport.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest("button")) return;
    pan = { id: event.pointerId, startX: event.clientX - panX, startY: event.clientY - panY };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add("is-panning");
  });
  viewport.addEventListener("pointermove", event => {
    if (pan?.id !== event.pointerId) return;
    panX = Math.max(-viewport.clientWidth * zoom / 2, Math.min(viewport.clientWidth * zoom / 2, event.clientX - pan.startX));
    panY = Math.max(-viewport.clientHeight * zoom / 2, Math.min(viewport.clientHeight * zoom / 2, event.clientY - pan.startY));
    updateView();
  });
  viewport.addEventListener("lostpointercapture", () => {
    pan = null;
    viewport.classList.remove("is-panning");
  });
  slider.addEventListener("input", () => {
    stop();
    syncCursor(slider.valueAsNumber);
  });
  slider.addEventListener("change", save);
  marks.addEventListener("pointerdown", event => {
    const dot = event.target.closest(".rail-event");
    if (!dot || event.button !== 0) return;
    skipMarkerClick = null;
    railDrag = { pointerId: event.pointerId, dot, x: event.clientX, moved: false };
    dot.setPointerCapture(event.pointerId);
  });
  marks.addEventListener("pointermove", event => {
    if (railDrag?.pointerId !== event.pointerId) return;
    if (!railDrag.moved && Math.abs(event.clientX - railDrag.x) < 4) return;
    railDrag.moved = true;
    stop();
    const box = rail.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
    syncCursor(range[0] + fraction * (range[1] - range[0]));
  });
  marks.addEventListener("lostpointercapture", () => {
    if (railDrag?.moved) {
      skipMarkerClick = railDrag.dot;
      save();
    }
    railDrag = null;
  });
  timeline.addEventListener("wheel", event => {
    if (!event.target.closest(".rail")) return;
    event.preventDefault();
    stop();
    const full = domain[1] - domain[0];
    const width = Math.min(full, Math.max(8, (range[1] - range[0]) * (event.deltaY < 0 ? 0.75 : 1 / 0.75)));
    const center = Math.min(range[1], Math.max(range[0], cursor));
    const start = Math.min(domain[1] - width, Math.max(domain[0], center - width / 2));
    range = [start, start + width];
    drawRuler();
    syncCursor(cursor, current);
  }, { passive: false });
  root.addEventListener("keydown", event => {
    if (event.target.matches("input:not(.rail-input),select,textarea")) return;
    if ((event.code === "Space" && !event.target.matches("button")) || event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      if (event.code === "Space") togglePlayback();
      else stepEvent(event.key === "ArrowRight" ? 1 : -1);
    }
  });

  function restore(widgetState) {
    const saved = widgetState?.privateContent;
    const selected = byId.get(saved?.id) ?? byId.get("nanjing");
    const preferred = saved?.subject;
    const next = Object.hasOwn(subjectLabels, preferred) && (preferred === "all" || selected.topics.includes(preferred))
      ? preferred : selected.topics[0];
    const time = Number.isFinite(saved?.cursor) ? saved.cursor : selected.time;
    if (current === selected && subject === next && time === cursor) return;
    stop();
    setSubject(next, time, selected);
  }
  restore(readSavedSelection());
  window.addEventListener("openai:set_globals", event => {
    if (event.detail?.globals && Object.hasOwn(event.detail.globals, "widgetState")) restore(event.detail.globals.widgetState);
  });
})();
</script>
